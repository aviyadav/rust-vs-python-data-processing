[package]
name = "rust-validator"
version = "0.1.0"
edition = "2021"
description = "Security validation layer for FastAPI file uploads — strict CSV parsing with size limits"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
