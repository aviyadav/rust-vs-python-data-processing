[package]
name = "rust-event-controller"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
rand = "0.10.1"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = "1.52.1"

[dependencies.uuid]
version = "1.8.0"
features = [
    "v4",
    "fast-rng",
    "macro-diagnostics"
]
