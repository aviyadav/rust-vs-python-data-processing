[package]
name = "gen_events"
version = "0.1.0"
edition = "2021"

[dependencies]
polars = { version = "0.45", features = ["random", "dtype-struct"] }
rand = "0.8"
rand_distr = "0.4"
uuid = { version = "1", features = ["v4"] }
csv = "1.3"
chrono = "0.4"
rayon = "1.10"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
