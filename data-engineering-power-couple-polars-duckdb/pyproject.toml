[project]
name = "data-engineering-power-couple-polars-duckdb"
version = "0.1.0"
description = "Comparing Pandas, DuckDB, and Polars on a user-events dataset, served via a FastAPI JSON API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.4",
    "fastapi>=0.139.0",
    "pandas>=3.0.3",
    "polars>=1.42.1",
    "pyarrow>=25.0.0",
    "uvicorn>=0.51.0",
]
