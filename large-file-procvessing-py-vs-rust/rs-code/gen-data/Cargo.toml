[package]
name = "gen-data"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gen-data"
path = "src/main.rs"

[dependencies]
rand = "0.8"
rayon = "1.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1", features = ["v4"] }
csv = "1.3"
num_cpus = "1.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
