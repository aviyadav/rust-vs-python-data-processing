[package]
name = "rust-xp-sqlite"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "allow", priority = -1 }


[dependencies]
# -- Async
tokio = { version = "1", features = ["full"] }

# -- Json
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# -- DB
rusqlite = { version = "0.40.2", features = ["bundled", "serde_json"] }

[dev-dependencies]
pretty-sqlite = { version = "0.6.0" }
